name: One-off project rename

on:
  push:
    paths:
      - '.github/workflows/rename-project.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old project name and Pages path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '雾下余粮': '污染边境',
              'https://junli-huang.github.io/game_a_try/': 'https://junli-huang.github.io/polluted-frontier/',
          }

          skip_dirs = {'.git', 'node_modules', 'dist'}
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              if path.as_posix().startswith('.github/workflows/'):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new_text = text
              for old, new in replacements.items():
                  new_text = new_text.replace(old, new)
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for item in changed:
              print(item)
          PY

      - name: Commit rename
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No rename changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: rename project to 污染边境'
          git push
