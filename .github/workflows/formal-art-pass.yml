name: Formal art pass

on:
  push:
    paths:
      - '.github/workflows/formal-art-pass.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/formal-art-pass
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build formal art resource pass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          art = root / 'public/assets/art'
          art.mkdir(parents=True, exist_ok=True)

          assets = {}

          assets['menu-bg.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
          <defs>
            <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101719"/><stop offset=".52" stop-color="#32352e"/><stop offset="1" stop-color="#171914"/></linearGradient>
            <linearGradient id="mud" x2="0" y2="1"><stop stop-color="#35362c"/><stop offset="1" stop-color="#11130f"/></linearGradient>
            <filter id="grain"><feTurbulence baseFrequency=".72" numOctaves="4" seed="27"/><feColorMatrix values=".18 0 0 0 0 0 .15 0 0 0 0 0 .10 0 0 0 0 0 .32 0"/><feBlend mode="overlay" in2="SourceGraphic"/></filter>
            <filter id="fog"><feTurbulence baseFrequency=".012 .035" numOctaves="3" seed="8"/><feGaussianBlur stdDeviation="10"/></filter>
          </defs>
          <rect width="1600" height="900" fill="url(#sky)"/>
          <path d="M0 430 Q170 345 330 405T650 375T970 400T1280 355T1600 395V900H0Z" fill="#1d211b"/>
          <path d="M0 585 Q220 510 410 575T760 530T1110 585T1600 520V900H0Z" fill="url(#mud)"/>
          <g fill="#0b0e0c" stroke="#596052" stroke-width="3" opacity=".92">
            <path d="M1190 190h28v285h-28zM1110 245h190v24h-190zM1138 160h132l-16 76h-102z"/>
            <path d="M104 540l32-254 13 146 52-97-35 218zM302 555l20-180 18 87 45-70-47 171zM1440 548l-15-220-18 120-55-92 43 201z"/>
          </g>
          <g fill="#151713" stroke="#4a4638" stroke-width="5">
            <path d="M840 565l30-122 205-30 63 152z"/><path d="M870 443l70-66 112 30 23 36z"/>
            <path d="M220 640l40-117 225 4 49 115z"/><path d="M252 523l93-69 127 73z"/>
          </g>
          <path d="M0 680 Q260 610 520 675T1020 650T1600 690" fill="none" stroke="#7b806f" stroke-opacity=".22" stroke-width="58" filter="url(#fog)"/>
          <rect width="1600" height="900" filter="url(#grain)" opacity=".45"/>
          <rect width="1600" height="900" fill="none" stroke="#756248" stroke-width="18" opacity=".34"/>
          </svg>'''

          assets['shelter-bg.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
          <defs><radialGradient id="glow"><stop stop-color="#d0c88f" stop-opacity=".72"/><stop offset=".18" stop-color="#76856a" stop-opacity=".28"/><stop offset="1" stop-color="#0d1110" stop-opacity="0"/></radialGradient><linearGradient id="wall" x2="0" y2="1"><stop stop-color="#22251f"/><stop offset="1" stop-color="#090b0a"/></linearGradient><filter id="noise"><feTurbulence baseFrequency=".55" numOctaves="4" seed="13"/><feColorMatrix values=".16 0 0 0 0 0 .13 0 0 0 0 0 .09 0 0 0 0 0 .28 0"/><feBlend mode="soft-light" in2="SourceGraphic"/></filter></defs>
          <rect width="1600" height="900" fill="#090c0b"/><path d="M120 900V280Q170 80 800 56t680 224v620z" fill="url(#wall)" stroke="#4b4638" stroke-width="12"/>
          <g stroke="#39382f" stroke-width="7" opacity=".82"><path d="M210 170v730M1390 170v730M470 78v822M1130 78v822"/><path d="M130 380h1340M118 650h1360"/></g>
          <ellipse cx="800" cy="435" rx="360" ry="330" fill="url(#glow)"/>
          <g transform="translate(800 405)"><path d="M0-125 72-24 28 96-26 112-78-16Z" fill="#aeb59b" stroke="#e1dcb3" stroke-width="9" opacity=".92"/><path d="M0-92 40-18 10 68-30-5Z" fill="#e0dcae" opacity=".68"/><path d="M-115 132Q0 95 115 132l44 72h-318z" fill="#25251d" stroke="#6f6549" stroke-width="8"/></g>
          <g fill="#171914" stroke="#59513d" stroke-width="6"><rect x="190" y="490" width="370" height="250" rx="18"/><rect x="1040" y="490" width="370" height="250" rx="18"/><rect x="580" y="680" width="440" height="150" rx="18"/></g>
          <g fill="#d18b4d" opacity=".55"><circle cx="280" cy="470" r="15"/><circle cx="1320" cy="470" r="15"/><circle cx="530" cy="610" r="11"/><circle cx="1070" cy="610" r="11"/></g>
          <rect width="1600" height="900" filter="url(#noise)" opacity=".5"/>
          </svg>'''

          assets['terrain-ground.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><defs><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".035 .055" numOctaves="5" seed="41"/><feColorMatrix values=".40 0 0 0 .05 0 .36 0 0 .05 0 0 .26 0 .03 0 0 0 .85 0"/><feBlend mode="multiply" in2="SourceGraphic"/></filter><radialGradient id="p"><stop stop-color="#556052"/><stop offset=".65" stop-color="#343a31"/><stop offset="1" stop-color="#20251f"/></radialGradient></defs><rect width="256" height="256" fill="url(#p)"/><path d="M-20 192Q45 153 89 187t93-13 95 6" fill="none" stroke="#78806a" stroke-opacity=".16" stroke-width="31"/><path d="M18 74q42-31 72 2t79-8 75 14" fill="none" stroke="#121711" stroke-opacity=".3" stroke-width="18"/><rect width="256" height="256" filter="url(#n)" opacity=".75"/></svg>'''

          assets['terrain-obstacle.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><defs><filter id="r"><feTurbulence baseFrequency=".045" numOctaves="4" seed="17"/><feDisplacementMap in="SourceGraphic" scale="8"/></filter></defs><rect width="256" height="256" fill="#20251f"/><g filter="url(#r)" stroke="#625e4e" stroke-width="5"><path d="M25 197 48 89 98 44l43 42 39-27 53 70-25 77z" fill="#2b2d28"/><path d="m57 164 35-65 45 24 36-34 31 77z" fill="#393a32"/></g><path d="M18 218q108-33 220 0" stroke="#0c0e0c" stroke-width="25" opacity=".55"/></svg>'''

          assets['player.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320"><defs><linearGradient id="c" x2="0" y2="1"><stop stop-color="#77766a"/><stop offset="1" stop-color="#252822"/></linearGradient></defs><ellipse cx="128" cy="296" rx="70" ry="18" fill="#000" opacity=".45"/><path d="M86 74q42-58 84 0l-10 58H96z" fill="#181b19" stroke="#817963" stroke-width="7"/><ellipse cx="128" cy="93" rx="28" ry="34" fill="#806f5d"/><path d="M68 141q62-37 121 2l26 131-57 18-29-88-31 89-58-17z" fill="url(#c)" stroke="#847b63" stroke-width="7"/><path d="m165 164 50 83" stroke="#22251f" stroke-width="18"/><path d="m180 178 50 82" stroke="#9b8a69" stroke-width="8"/><path d="M92 81q34-39 71 0l-20-56-37 7z" fill="#101310"/></svg>'''

          assets['enemy.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300"><defs><filter id="w"><feTurbulence baseFrequency=".025" numOctaves="3" seed="6"/><feDisplacementMap in="SourceGraphic" scale="11"/></filter></defs><ellipse cx="162" cy="273" rx="116" ry="20" fill="#000" opacity=".45"/><g filter="url(#w)" stroke="#7a4b3f" stroke-width="7"><path d="M43 194q18-88 92-104 87-20 137 58l-23 67-63 20-72-2-70-17z" fill="#4d302b"/><path d="m228 130 61-39-25 58 37 15-67 22z" fill="#2b211f"/><path d="M91 205 68 273M145 213l-10 65M205 207l26 64M252 193l34 58" stroke="#34221e" stroke-width="19"/></g><circle cx="264" cy="136" r="8" fill="#e06349"/></svg>'''

          assets['nest.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320"><defs><radialGradient id="m"><stop stop-color="#9c493b"/><stop offset=".55" stop-color="#542a26"/><stop offset="1" stop-color="#231918"/></radialGradient><filter id="d"><feTurbulence baseFrequency=".035" numOctaves="4" seed="12"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter></defs><ellipse cx="160" cy="286" rx="120" ry="24" fill="#000" opacity=".45"/><g filter="url(#d)" fill="none" stroke="#573027" stroke-width="18" stroke-linecap="round"><path d="M155 238Q55 210 43 102M174 237Q276 207 286 76M137 249Q76 267 52 302M190 246Q254 260 286 296M162 218Q113 105 143 29M178 220Q223 114 205 38"/></g><circle cx="165" cy="204" r="87" fill="url(#m)" stroke="#8b4b3a" stroke-width="10"/><g fill="#c27763" opacity=".55"><circle cx="130" cy="174" r="23"/><circle cx="184" cy="156" r="31"/><circle cx="202" cy="211" r="20"/><circle cx="145" cy="228" r="26"/></g></svg>'''

          assets['corpse.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220"><ellipse cx="160" cy="183" rx="122" ry="22" fill="#000" opacity=".5"/><path d="M42 142q61-73 143-51l78 50-51 37-102-9z" fill="#48352f" stroke="#756155" stroke-width="8"/><path d="m96 153-57 43m171-37 73 30M128 110l-15-73m67 65 24-69" stroke="#332723" stroke-width="18" stroke-linecap="round"/><circle cx="232" cy="129" r="7" fill="#b94d3d" opacity=".5"/></svg>'''

          assets['extract.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320"><defs><radialGradient id="g"><stop stop-color="#e6ddb0"/><stop offset=".16" stop-color="#9ca67d" stop-opacity=".8"/><stop offset="1" stop-color="#50604c" stop-opacity="0"/></radialGradient></defs><ellipse cx="128" cy="190" rx="120" ry="120" fill="url(#g)"/><path d="M118 48h20v194h-20zM72 241h112l29 41H43z" fill="#32352d" stroke="#b0a477" stroke-width="7"/><path d="M76 94h104l-18 37H94z" fill="#8e8767"/><circle cx="128" cy="108" r="14" fill="#e9dfaa"/></svg>'''

          assets['fog.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><defs><filter id="f"><feTurbulence type="fractalNoise" baseFrequency=".018 .032" numOctaves="5" seed="31"/><feColorMatrix values=".18 0 0 0 .02 0 .22 0 0 .03 0 0 .19 0 .02 0 0 0 .88 0"/><feGaussianBlur stdDeviation="2"/></filter><radialGradient id="v"><stop stop-color="#171c19" stop-opacity=".75"/><stop offset="1" stop-color="#030504" stop-opacity=".98"/></radialGradient></defs><rect width="256" height="256" fill="url(#v)"/><rect width="256" height="256" filter="url(#f)" opacity=".82"/></svg>'''

          assets['facing-arrow.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><path d="M108 64 34 18v29H12v34h22v29z" fill="#ddd0a7" stroke="#433a2c" stroke-width="7"/></svg>'''
          assets['alert.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><path d="M64 8 120 110H8Z" fill="#7b2b25" stroke="#d58e65" stroke-width="7"/><path d="M59 38h10l-2 40H61zm0 52h10v10H59z" fill="#f0d8b1"/></svg>'''
          assets['safe-food.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><rect x="25" y="35" width="110" height="94" rx="12" fill="#6c684f" stroke="#b1a77e" stroke-width="8"/><path d="M42 69h76M42 91h52" stroke="#d6c995" stroke-width="9"/><path d="M50 30v18m60-18v18" stroke="#2c2e27" stroke-width="12"/></svg>'''
          assets['meat.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160"><path d="M20 101q15-69 74-77 56-7 72 40 17 51-43 73-73 27-103-36z" fill="#6b302c" stroke="#a45a4a" stroke-width="8"/><path d="M62 58q28-20 55-5m-70 46q47 27 94-9" fill="none" stroke="#c27763" stroke-opacity=".5" stroke-width="10"/></svg>'''
          assets['relic.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220"><defs><radialGradient id="rg"><stop stop-color="#f0e9bd"/><stop offset=".45" stop-color="#a9b597"/><stop offset="1" stop-color="#4f6655"/></radialGradient></defs><path d="M89 15 148 79 119 183 58 188 29 78Z" fill="url(#rg)" stroke="#d9d0a5" stroke-width="8"/><path d="m90 48 28 42-17 63-35-8-8-50z" fill="#eef0c7" opacity=".5"/></svg>'''
          assets['farm.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180"><path d="M15 146q105-47 210 0v25H15z" fill="#4b3928"/><g stroke="#748259" stroke-width="9" fill="none"><path d="M60 146Q50 89 77 44M118 146q0-74 24-112M178 146q-9-65 29-100"/><path d="M73 78 42 65m35 34 28-20m37-18-30-18m30 51 35-25m30 5-27-21"/></g></svg>'''
          assets['panel-texture.svg'] = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><defs><filter id="p"><feTurbulence baseFrequency=".075" numOctaves="4" seed="21"/><feColorMatrix values=".22 0 0 0 0 0 .17 0 0 0 0 0 .12 0 0 0 0 0 .26 0"/><feBlend mode="overlay" in2="SourceGraphic"/></filter></defs><rect width="640" height="360" rx="18" fill="#171b18" stroke="#716047" stroke-width="10"/><rect x="13" y="13" width="614" height="334" rx="12" fill="none" stroke="#3b352a" stroke-width="3"/><path d="M16 20 80 8m480 344 64-17M8 300l52 50M575 12l49 44" stroke="#9c7d55" stroke-opacity=".36" stroke-width="7"/><rect width="640" height="360" filter="url(#p)" opacity=".72"/></svg>'''

          for name, content in assets.items():
              (art / name).write_text(content, encoding='utf-8')

          formal_css = r'''
          :root{--art-border:#6e5d43;--art-ink:#d8cfb0;--art-muted:#9b9884;--art-red:#87352d;--art-green:#5f6e50;--art-panel:rgba(16,19,17,.92)}
          body{background:#090c0b;color:var(--art-ink);font-family:"Noto Serif SC","Songti SC","Microsoft YaHei",serif}
          button{border:1px solid #66563f!important;background:#201f19 url('./assets/art/panel-texture.svg') center/cover!important;color:#d8cfb0!important;border-radius:3px!important;box-shadow:inset 0 0 0 1px #171813,0 5px 18px #0008;text-shadow:0 1px 1px #000;letter-spacing:.05em}
          button:hover:not(:disabled){filter:brightness(1.16);border-color:#9b815b!important;transform:translateY(-1px)}
          button.primary{background:#5d2822 url('./assets/art/panel-texture.svg') center/cover!important;border-color:#9a5a45!important}
          button.danger{color:#e1a18d!important;border-color:#7b392f!important}
          .panel,.hud,.exploration-side,.modal-card,.config-card,.battle-screen,.danger-notice{background-color:var(--art-panel)!important;background-image:linear-gradient(#101411dd,#101411dd),url('./assets/art/panel-texture.svg')!important;background-size:cover!important;border-color:#62543e!important;box-shadow:inset 0 0 0 1px #25251e,0 15px 38px #0009!important}
          .menu-screen{min-height:100vh;background:linear-gradient(90deg,#080b0ad9 0 32%,#080b0a50 58%,#080b0ae8 100%),url('./assets/art/menu-bg.svg') center/cover no-repeat!important;overflow:hidden}
          .menu-screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 55% 48%,transparent 0 34%,#050807aa 84%),linear-gradient(180deg,transparent 70%,#050807cc)}
          .menu-copy,.menu-note{position:relative;z-index:2}.menu-copy h1{font-size:clamp(3.4rem,8vw,7.5rem)!important;letter-spacing:.06em;color:#ded5b7!important;text-shadow:0 4px 0 #181713,0 10px 28px #000}.menu-copy .tagline{max-width:32rem;color:#b8b29d!important}.menu-actions{max-width:22rem}.menu-actions button{min-height:52px;text-align:left;padding-left:1.4rem}
          .menu-fog{background:url('./assets/art/fog.svg') center/560px 360px repeat!important;mix-blend-mode:screen;opacity:.18!important;animation:fogDrift 24s linear infinite!important}
          @keyframes fogDrift{to{background-position:560px 35px}}
          .shelter-screen{min-height:100vh;background:linear-gradient(#090c0bb8,#090c0be5),url('./assets/art/shelter-bg.svg') center top/cover fixed no-repeat!important;padding:22px clamp(18px,3vw,48px)!important}
          .shelter-grid{position:relative;z-index:1;grid-template-columns:repeat(12,1fr)!important;gap:18px!important}.status-panel{grid-column:span 4}.pantry-panel{grid-column:span 4}.relic-panel{grid-column:span 4}.farm-panel{grid-column:span 3}.expedition-panel{grid-column:span 6}.goal-panel{grid-column:span 3}
          .resource-icon.safe{background:url('./assets/art/safe-food.svg') center/contain no-repeat!important}.resource-icon.meat{background:url('./assets/art/meat.svg') center/contain no-repeat!important}.relic-visual{min-height:180px;background:url('./assets/art/relic.svg') center/contain no-repeat!important}.relic-visual i{display:none!important}.farm-visual{min-height:150px;background:url('./assets/art/farm.svg') center/contain no-repeat!important}.farm-visual i{display:none!important}
          .game-screen{min-height:100vh;background:linear-gradient(#080b0bd8,#080b0bf0),url('./assets/art/menu-bg.svg') center/cover fixed no-repeat!important;padding:18px!important}.exploration-layout{gap:16px!important;align-items:stretch!important}.exploration-layout canvas{background:#121712!important;border:7px solid #3a3428!important;outline:1px solid #816c4d!important;box-shadow:0 20px 60px #000,inset 0 0 0 1px #090a08;border-radius:2px!important}.exploration-side{border:5px solid #332f26!important;outline:1px solid #77644a;padding:20px!important}.exploration-side h3{font-size:1.7rem!important;color:#d8cfb0!important}.turn-message{border-left:3px solid #8b6d45!important;background:#0a0d0bbb!important}.legend i{filter:drop-shadow(0 1px 2px #000)}
          .hud{margin-top:14px!important;border:4px solid #302c24!important;outline:1px solid #735f45;padding:14px 18px!important}.hud-bars label>i{height:11px!important;background:#0a0c0a!important;border:1px solid #514838!important}.hud-bars label:nth-child(1)>i b{background:#8b3a31!important}.hud-bars label:nth-child(2)>i b{background:#8c7041!important}.hud-bars label:nth-child(3)>i b{background:#64714d!important}.hud-bars label:nth-child(4)>i b{background:#625168!important}
          .madness-overlay{background-image:url('./assets/art/fog.svg')!important;background-size:460px 460px!important;mix-blend-mode:screen!important;opacity:.06!important}.madness-high .madness-overlay,.madness-severe .madness-overlay{opacity:.13!important;filter:hue-rotate(300deg) saturate(1.4)}
          .combatant-art{font-size:0!important;height:240px!important;background-position:center bottom!important;background-repeat:no-repeat!important;background-size:contain!important}.player-combatant .combatant-art{background-image:url('./assets/art/player.svg')!important}.enemy-combatant .combatant-art{background-image:url('./assets/art/enemy.svg')!important}.battle-screen{background-image:linear-gradient(#090c0bdd,#090c0bdd),url('./assets/art/menu-bg.svg')!important;background-size:cover!important}
          .mobile-pad button{width:62px!important;height:62px!important;background:#171a16e8 url('./assets/art/panel-texture.svg') center/cover!important;font-size:1.2rem!important}
          .modal-backdrop{backdrop-filter:blur(8px);background:#020403c9!important}.modal-card{border:6px solid #302c24!important;outline:1px solid #806b4c!important}.modal-card h2{color:#ded4b5!important}
          .config-screen{background:#090c0b url('./assets/art/menu-bg.svg') center/cover fixed!important}.config-layout,.config-header,.config-footer{background:#0c100ee8!important}.config-nav button.active{border-left:4px solid #987349!important;background:#26231b!important}
          @media(max-width:980px){.shelter-grid{grid-template-columns:1fr!important}.status-panel,.pantry-panel,.relic-panel,.farm-panel,.expedition-panel,.goal-panel{grid-column:auto!important}.exploration-layout{grid-template-columns:1fr!important}.exploration-side{order:2}.game-screen{padding:8px!important}.hud{padding:10px!important}.combatant-art{height:160px!important}}
          @media(prefers-reduced-motion:reduce){.menu-fog{animation:none!important}}
          '''
          (root / 'formal-art.css').write_text(formal_css, encoding='utf-8')

          index = (root / 'index.html').read_text(encoding='utf-8')
          if './formal-art.css' not in index:
              index = index.replace('<link rel="stylesheet" href="./style.css" />', '<link rel="stylesheet" href="./style.css" />\n    <link rel="stylesheet" href="./formal-art.css" />')
          (root / 'index.html').write_text(index, encoding='utf-8')

          runtime_path = root / 'src/game-runtime.js'
          runtime = runtime_path.read_text(encoding='utf-8')

          helper = r'''
          const FORMAL_ART_FILES = {
            ground: './assets/art/terrain-ground.svg', obstacle: './assets/art/terrain-obstacle.svg',
            player: './assets/art/player.svg', enemy: './assets/art/enemy.svg', nest: './assets/art/nest.svg',
            corpse: './assets/art/corpse.svg', extract: './assets/art/extract.svg', fog: './assets/art/fog.svg',
            facing: './assets/art/facing-arrow.svg', alert: './assets/art/alert.svg'
          };

          function createFormalArt(onReady) {
            const assets = {};
            if (typeof Image === 'undefined') return assets;
            for (const [key, src] of Object.entries(FORMAL_ART_FILES)) {
              const image = new Image();
              image.decoding = 'async';
              image.onload = () => onReady?.();
              image.src = src;
              assets[key] = image;
            }
            return assets;
          }

          function drawImageCover(ctx, image, x, y, width, height, alpha = 1) {
            if (!image?.complete || !image.naturalWidth) return false;
            const scale = Math.max(width / image.naturalWidth, height / image.naturalHeight);
            const sw = width / scale, sh = height / scale;
            const sx = (image.naturalWidth - sw) / 2, sy = (image.naturalHeight - sh) / 2;
            ctx.save(); ctx.globalAlpha = alpha; ctx.drawImage(image, sx, sy, sw, sh, x, y, width, height); ctx.restore();
            return true;
          }
          '''
          if 'FORMAL_ART_FILES' not in runtime:
              runtime = runtime.replace('const clone = (value) => structuredClone(value);', 'const clone = (value) => structuredClone(value);\n' + helper)
          if 'this.art = createFormalArt' not in runtime:
              runtime = runtime.replace('this.ctx = canvas.getContext(\'2d\');', "this.ctx = canvas.getContext('2d');\n    this.art = createFormalArt(() => this.render());")

          old_ground = "ctx.fillStyle = tile.walkable ? '#293d35' : '#15221e'; ctx.fillRect(px, py, size, size);\n      this.drawGroundTexture(px, py, size, tile);"
          new_ground = "this.drawTerrainArt(px, py, size, tile);"
          runtime = runtime.replace(old_ground, new_ground)

          marker = '  drawGroundTexture(px, py, size, tile) {'
          if '  drawTerrainArt(px, py, size, tile) {' not in runtime:
              insert = r'''  drawTerrainArt(px, py, size, tile) {
            const image = tile.walkable ? this.art.ground : this.art.obstacle;
            if (!drawImageCover(this.ctx, image, px, py, size, size, tile.walkable ? 1 : .96)) {
              this.ctx.fillStyle = tile.walkable ? '#30382f' : '#1b211d'; this.ctx.fillRect(px, py, size, size);
            }
            if (tile.walkable) {
              const variation = (seededFogJitter(tile.x, tile.y) + 1) * .5;
              this.ctx.fillStyle = `rgba(11,15,12,${.08 + variation * .09})`; this.ctx.fillRect(px, py, size, size);
            }
          }

          '''
              runtime = runtime.replace(marker, insert + marker)

          runtime = re.sub(r"  drawFog\(camera, tiles\) \{.*?\n  \}\n\n  drawEnemy\(", r'''  drawFog(camera, tiles) {
            const ctx = this.ctx, size = this.tileSize;
            for (const tile of tiles) {
              if (tile.visibility !== 'unexplored') continue;
              const px = (tile.x - camera.x) * size, py = (tile.y - camera.y) * size;
              if (!drawImageCover(ctx, this.art.fog, px - 2, py - 2, size + 4, size + 4, .97)) {
                ctx.fillStyle = '#050807'; ctx.fillRect(px, py, size, size);
              }
            }
          }

          drawEnemy(''', runtime, count=1, flags=re.S)

          runtime = re.sub(r"  drawEnemy\(px, py, size, enemy, memory\) \{.*?\n  \}\n\n  getVisibleEnemyVision", r'''  drawEnemy(px, py, size, enemy, memory) {
            const ctx = this.ctx; ctx.save(); ctx.globalAlpha = memory ? .38 : 1;
            const image = enemy.isSpawner ? this.art.nest : this.art.enemy;
            const scale = enemy.isSpawner ? 1.18 : 1.06;
            const inset = size * (1 - scale) / 2;
            drawImageCover(ctx, image, px + inset, py + inset, size * scale, size * scale, 1);
            if (!memory && enemy.visionEnabled && !enemy.isSpawner && this.art.facing?.complete) {
              const angle = directionAngle(enemy.facing);
              const centerX = px + size / 2, centerY = py + size / 2;
              ctx.translate(centerX, centerY); ctx.rotate(angle);
              const markerSize = size * .34;
              ctx.drawImage(this.art.facing, size * .24, -markerSize / 2, markerSize, markerSize);
              ctx.rotate(-angle); ctx.translate(-centerX, -centerY);
            }
            if (!memory && ['Alert', 'Chase', 'AttackIntent'].includes(enemy.state) && this.art.alert?.complete) {
              const markerSize = size * .38;
              ctx.globalAlpha = enemy.state === 'AttackIntent' ? 1 : .78;
              ctx.drawImage(this.art.alert, px + size * .58, py - size * .05, markerSize, markerSize);
            }
            if (memory) {
              ctx.fillStyle = 'rgba(12,15,12,.5)'; ctx.fillRect(px, py, size, size);
            }
            ctx.restore();
          }

          getVisibleEnemyVision''', runtime, count=1, flags=re.S)

          runtime = re.sub(r"  drawCorpse\(px, py, size, memory\) \{.*?\n  \}\n\n  drawExtract", r'''  drawCorpse(px, py, size, memory) {
            const alpha = memory ? .36 : .92;
            if (!drawImageCover(this.ctx, this.art.corpse, px + size * .02, py + size * .18, size * .96, size * .72, alpha)) {
              this.ctx.fillStyle = '#55473b'; this.ctx.fillRect(px + size * .2, py + size * .42, size * .6, size * .18);
            }
          }

          drawExtract''', runtime, count=1, flags=re.S)

          runtime = re.sub(r"  drawExtract\(px, py, size, memory\) \{.*?\n  \}\n\n  getCamera", r'''  drawExtract(px, py, size, memory) {
            const alpha = memory ? .48 : 1;
            if (!drawImageCover(this.ctx, this.art.extract, px + size * .1, py - size * .04, size * .8, size * 1.08, alpha)) {
              this.ctx.strokeStyle = '#b7b18a'; this.ctx.strokeRect(px + 5, py + 5, size - 10, size - 10);
            }
          }

          getCamera''', runtime, count=1, flags=re.S)

          runtime = re.sub(r"  drawPlayer\(camera\) \{.*?\n  \}\n\}", r'''  drawPlayer(camera) {
            const ctx = this.ctx, size = this.tileSize, px = (this.player.x - camera.x) * size, py = (this.player.y - camera.y) * size;
            ctx.save();
            ctx.shadowColor = 'rgba(218,205,157,.35)'; ctx.shadowBlur = Math.max(4, size * .22);
            if (!drawImageCover(ctx, this.art.player, px - size * .05, py - size * .16, size * 1.1, size * 1.18, 1)) {
              ctx.fillStyle = '#d9d0ae'; ctx.fillRect(px + size * .3, py + size * .18, size * .4, size * .64);
            }
            ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(214,194,132,.65)'; ctx.lineWidth = Math.max(1, size * .035); ctx.strokeRect(px + 2, py + 2, size - 4, size - 4); ctx.restore();
          }
          }''', runtime, count=1, flags=re.S)

          runtime_path.write_text(runtime, encoding='utf-8')

          game_path = root / 'game.js'
          game = game_path.read_text(encoding='utf-8')
          game = game.replace("${button('原地等待', 'wait')}${button('使用道具', 'use-item', 'item-button')}", "${button('等待一回合', 'wait')}${button('使用补给', 'use-item', 'item-button')}")
          game = game.replace('<div class="combatant-art">猎</div>', '<div class="combatant-art" aria-label="幸存者"></div>')
          game = game.replace('<div class="combatant-art" style="--enemy:${view.enemy.color}">异</div>', '<div class="combatant-art" style="--enemy:${view.enemy.color}" aria-label="敌人"></div>')
          game_path.write_text(game, encoding='utf-8')

          doc = '''# V3.1 正式美术资源化检点\n\n## 目标\n\n把 V3 远征主线从程序占位美术切换为静态正式资源驱动，同时保持格子、视野、回合和碰撞等玩法逻辑不变。\n\n## 本次替换\n\n- 主菜单：正式荒野背景、雾层与材质化按钮。\n- 庇护所：正式地下空间背景、圣遗物、食物、异变肉与种植资源。\n- 户外地图：地表、障碍、玩家、敌人、巢穴、尸体、撤离点、未探索迷雾全部改用静态美术资源。\n- 战斗：移除“猎 / 异”程序占位字，改用角色/敌人美术。\n- UI：面板、HUD、按钮、弹窗统一为磨损金属/皮革式暗色框架。\n\n## 保留的程序层\n\n- 格子坐标与移动规则。\n- 敌人方向视野的几何裁剪与危险范围，因为它属于战术信息层而不是角色美术。\n- 状态数值、进度条宽度与迷雾可见性判定。\n\n## 验收标准\n\n1. 页面上不再使用圆点/文字字符充当玩家、敌人或战斗角色美术。\n2. 地图未探索区域使用纹理迷雾资源，而不是纯黑矩形作为最终表现。\n3. 庇护所的核心功能卡片具有明确美术主题而非默认 Web 面板。\n4. 桌面和移动端仍可完整操作。\n5. `npm test` 与 `npm run build` 通过。\n'''
          (root / 'docs/design/v3.1-formal-art-pass.md').write_text(doc, encoding='utf-8')
          PY

      - name: Test and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit formal art pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/art formal-art.css index.html game.js src/game-runtime.js docs/design/v3.1-formal-art-pass.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: replace prototype visuals with formal art pass'
          git push origin HEAD:agent/formal-art-pass
