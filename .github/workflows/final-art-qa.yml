name: Final art QA

on:
  push:
    paths:
      - '.github/workflows/final-art-qa.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/formal-art-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify formal assets in dist
        run: |
          test -s dist/assets/art/formal-actors.webp
          test -s dist/assets/art/formal-props.webp
          test -s dist/assets/art/formal-tiles.webp
          test -s dist/formal-art-qa.css
