name: Formal art pass 2

on:
  push:
    paths:
      - '.github/workflows/formal-art-pass-2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/formal-art-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply second formal UI pass
        run: python3 scripts/formal_art_pass_2.py
      - name: Verify
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit second pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add formal-art.css game.js docs/design/v3.1-formal-art-pass.md
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'feat: refine formal game UI composition'
          git push origin HEAD:agent/formal-art-pass
